<!doctype html>
<html lang="en" data-bs-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smart RTO {% block title %}{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="/static/style.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark rto-nav">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="/">
      <span class="sig-dot sig-red"></span><span class="sig-dot sig-yellow"></span><span class="sig-dot sig-green"></span>
      Smart RTO <small class="brand-sub">Traffic Violation Monitor</small>
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#rtoNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="rtoNav">
      <div class="navbar-nav ms-auto">
        <a class="nav-link {% if request.path=='/' %}active{% endif %}" href="/">Dashboard</a>
        <a class="nav-link {% if request.path=='/live' %}active{% endif %}" href="/live">Live Monitoring</a>
        <a class="nav-link {% if request.path=='/violations' %}active{% endif %}" href="/violations">Violations</a>
        <a class="nav-link {% if request.path=='/vehicle' %}active{% endif %}" href="/vehicle">Vehicle History</a>
        <a class="nav-link {% if request.path=='/reports' %}active{% endif %}" href="/reports">Reports</a>
      </div>
    </div>
  </div>
</nav>
<div class="status-strip">
  <div class="container-fluid d-flex flex-wrap gap-2 align-items-center">
    <span id="sys-signal" class="pill">Signal: …</span>
    <span id="sys-arduino" class="pill">Arduino: …</span>
    <span id="sys-camera" class="pill">Camera: …</span>
    <span id="sys-db" class="pill">DB: …</span>
    <span class="ms-auto strip-hint">Laptop webcam + Arduino Uno prototype</span>
  </div>
</div>
<div class="container mt-4 mb-5">
{% block content %}{% endblock %}
</div>
<div id="toasts" class="toast-box"></div>
<footer class="rto-foot">College prototype — Potential violations need human verification. No legal validity.</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
