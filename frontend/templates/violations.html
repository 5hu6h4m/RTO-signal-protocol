{% extends "base.html" %}{% block title %}Violations{% endblock %}
{% block content %}
<h3 class="section-title">All Violations</h3>
<p class="muted">Filter + evidence photos. Click photo for full size.</p>
<div class="row mb-3 g-2">
  <div class="col-md-3">
    <select id="f" class="form-select" onchange="load()">
      <option value="">All types</option><option>No Helmet</option>
      <option>Triple Riding</option><option>Red Light Violation</option><option>Other</option>
    </select>
  </div>
  <div class="col-md-3"><input id="d" type="date" class="form-control" onchange="load()"></div>
  <div class="col-md-3"><button class="btn btn-primary" onclick="load()">Apply</button>
  <button class="btn btn-outline-light" onclick="csv()">Export CSV</button></div>
</div>
<div class="card"><div class="card-body table-responsive">
<table class="table table-hover"><thead><tr>
<th>Vehicle</th><th>Violation</th><th>Date</th><th>Time</th><th>Status</th><th>Evidence</th>
</tr></thead><tbody id="rows"><tr><td colspan="6" class="muted">Loading…</td></tr></tbody></table>
</div></div>
<script>
let cache = [];
async function load() {
  const f = document.getElementById('f').value;
  const d = document.getElementById('d').value;
  let url = '/api/violations?limit=200';
  if (f) url += '&type=' + encodeURIComponent(f);
  if (d) url += '&date=' + encodeURIComponent(d);
  cache = await (await fetch(url)).json();
  document.getElementById('rows').innerHTML = cache.length ? cache.map(rowHtml).join('') : '<tr><td colspan="6" class="muted">No records.</td></tr>';
}
function csv() {
  const head = 'vehicle,violation,timestamp,status\n';
  const body = cache.map(v => [v.vehicle_number, v.violation_type, v.timestamp, '"' + (v.status||'').replace(/"/g,'') + '"'].join(',')).join('\n');
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([head + body], {type:'text/csv'}));
  a.download = 'violations.csv'; a.click();
}
load();
</script>
{% endblock %}
